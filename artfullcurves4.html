
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmisk Kurvritare - Steglängd</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* UI-panel med mjuk övergång */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            transition: all 0.3s ease-in-out;
            max-width: 300px;
        }
        #ui.collapsed {
            padding: 5px;
            background: rgba(0, 0, 0, 0.6);
        }
        #uiContent {
            transition: opacity 0.2s ease;
        }
        .hidden {
            display: none !important;
        }
        
        /* Knapp- och radiostilar */
        .radio-group {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
        }
        .radio-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .radio-group label:last-child {
            margin-bottom: 0;
        }
        
        .main-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            flex-grow: 1;
            font-weight: bold;
        }
        button:hover { background: #444; }
        
        #clearBtn {
            width: 100%;
            background: #552222;
            border-color: #773333;
            font-weight: normal;
        }
        #clearBtn:hover { background: #663333; }
        
        #toggleUiBtn {
            background: #222;
            border-color: #444;
            width: 100%;
            margin-bottom: 10px;
            font-weight: normal;
        }
        #toggleUiBtn:hover { background: #333; }
        #ui.collapsed #toggleUiBtn {
            margin-bottom: 0;
            width: auto;
        }

        /* Status text */
        .status-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            border: 1px solid #222;
        }
        .status-text { 
            margin-bottom: 5px; 
            font-size: 13px;
            color: #ccc;
        }
        .status-text:last-child {
            margin-bottom: 0;
        }
        .val-highlight {
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">
        <button id="toggleUiBtn">Dölj panel</button>
        
        <div id="uiContent">
            
            <div class="radio-group">
                <label><input type="radio" name="controlMode" value="curves" checked> Antal kurvor (1-5)</label>
                <label><input type="radio" name="controlMode" value="angle"> Vinkelintervall (10°-90°)</label>
                <label><input type="radio" name="controlMode" value="size"> Linjebredd (1-10)</label>
                <label><input type="radio" name="controlMode" value="stepsize"> Steglängd (1-20)</label>
                <label><input type="radio" name="controlMode" value="delay"> Fördröjning i ms (bromsa)</label>
                <label><input type="radio" name="controlMode" value="steps"> Segment per animering</label>
            </div>

            <div class="main-controls">
                <button id="decBtn">➖ Minska</button>
                <button id="incBtn">➕ Öka</button>
            </div>

            <button id="clearBtn">Rensa skärm</button>

            <div class="status-box">
                <div class="status-text">Kurvor: <span id="statusCurves" class="val-highlight">1</span></div>
                <div class="status-text">Vinkel: <span id="statusAngle" class="val-highlight">±45°</span></div>
                <div class="status-text">Linjebredd: <span id="statusSize" class="val-highlight">2</span></div>
                <div class="status-text">Steglängd: <span id="statusStepsize" class="val-highlight">10 punkter</span></div>
                <div class="status-text">Fördröjning: <span id="statusDelay" class="val-highlight">1 ms</span></div>
                <div class="status-text">Linjelängd: <span id="statusSteps" class="val-highlight">1 segment/frame</span></div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ff00ff', '#ffff00','#00ffff', '#aaaaaa', '#666666'];
        
        // --- Parametrar ---
        const angleIntervals = [10, 15, 30, 45, 60, 75, 90];
        let angleIndex = 3; // Startar på 45 grader
        let penSize = 2;
        let globalStepSize = 10; // Ny global variabel för steglängd (1-20)
        
        const customIntervals = [1, 5, 10, 25, 100, 250, 1000];
        let delayIndex = 0; 
        let stepsIndex = 0; 

        class Curve {
            constructor(color) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.angle = Math.random() * Math.PI * 2;
                this.color = color;
                this.register = [];
            }

            updateAndDraw() {
                const bit = Math.random() < 0.5 ? 0 : 1;
                this.register.push(bit);

                let angleChange = 0;
                const currentInterval = angleIntervals[angleIndex];

                if (this.register.length >= 2) {
                    const len = this.register.length;
                    const last = this.register[len - 1];
                    const prev = this.register[len - 2];

                    if (last === 0 && prev === 0) {
                        angleChange = -currentInterval;
                        this.register = []; 
                    } 
                    else if (last === 1 && prev === 1) {
                        angleChange = currentInterval;
                        this.register = [];
                    } 
                    else {
                        angleChange = 0;
                        if (this.register.length > 5) {
                            this.register.shift();
                        }
                    }
                }

                this.angle += angleChange * (Math.PI / 180);

                // Använder den globalt inställda steglängden här
                const nextX = this.x + Math.cos(this.angle) * globalStepSize;
                const nextY = this.y + Math.sin(this.angle) * globalStepSize;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(nextX, nextY);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = penSize;
                ctx.stroke();

                this.x = nextX;
                this.y = nextY;

                if (this.x < 0) this.x += canvas.width;
                if (this.x > canvas.width) this.x -= canvas.width;
                if (this.y < 0) this.y += canvas.height;
                if (this.y > canvas.height) this.y -= canvas.height;
            }
        }

        let curves = [];
        curves.push(new Curve(colors[0]));

        function updateUI() {
            document.getElementById('statusCurves').innerText = curves.length;
            document.getElementById('statusAngle').innerText = `±${angleIntervals[angleIndex]}°`;
            document.getElementById('statusSize').innerText = penSize;
            document.getElementById('statusStepsize').innerText = `${globalStepSize} punkter`;
            
            const delayVal = customIntervals[delayIndex];
            document.getElementById('statusDelay').innerText = delayVal === 1 ? "1 ms (Max)" : `${delayVal} ms`;
            document.getElementById('statusSteps').innerText = `${customIntervals[stepsIndex]}`;
        }

        // Öka-knappen
        document.getElementById('incBtn').addEventListener('click', () => {
            const mode = document.querySelector('input[name="controlMode"]:checked').value;
            
            if (mode === 'curves' && curves.length < 8) curves.push(new Curve(colors[curves.length]));
            else if (mode === 'angle' && angleIndex < angleIntervals.length - 1) angleIndex++;
            else if (mode === 'size' && penSize < 10) penSize++;
            else if (mode === 'stepsize' && globalStepSize < 20) globalStepSize++; // Öka steglängd
            else if (mode === 'delay' && delayIndex < customIntervals.length - 1) delayIndex++;
            else if (mode === 'steps' && stepsIndex < customIntervals.length - 1) stepsIndex++;
            
            updateUI();
        });

        // Minska-knappen
        document.getElementById('decBtn').addEventListener('click', () => {
            const mode = document.querySelector('input[name="controlMode"]:checked').value;
            
            if (mode === 'curves' && curves.length > 1) curves.pop();
            else if (mode === 'angle' && angleIndex > 0) angleIndex--;
            else if (mode === 'size' && penSize > 1) penSize--;
            else if (mode === 'stepsize' && globalStepSize > 1) globalStepSize--; // Minska steglängd
            else if (mode === 'delay' && delayIndex > 0) delayIndex--;
            else if (mode === 'steps' && stepsIndex > 0) stepsIndex--;
            
            updateUI();
        });

        // Rensa skärmen
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            curves.forEach(c => {
                c.x = Math.random() * canvas.width;
                c.y = Math.random() * canvas.height;
                c.register = [];
            });
        });

        // Dölj/Visa panel
        const toggleUiBtn = document.getElementById('toggleUiBtn');
        const uiPanel = document.getElementById('ui');
        const uiContent = document.getElementById('uiContent');

        toggleUiBtn.addEventListener('click', () => {
            uiPanel.classList.toggle('collapsed');
            uiContent.classList.toggle('hidden');
            toggleUiBtn.innerText = uiPanel.classList.contains('collapsed') ? "" : "Dölj panel";
        });

        // Tidsstyrd animationsloop
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const currentDelay = customIntervals[delayIndex];

            if (currentDelay === 1 || (currentTime - lastTime >= currentDelay)) {
                const currentSteps = customIntervals[stepsIndex];
                
                for (let i = 0; i < currentSteps; i++) {
                    curves.forEach(curve => curve.updateAndDraw());
                }
                
                lastTime = currentTime;
            }
        }

        // Starta loopen
        requestAnimationFrame(animate);
        // Initiera UI-texterna vid start
        updateUI();
    </script>
</body>
</html>
