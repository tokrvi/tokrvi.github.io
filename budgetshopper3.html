<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inköpskalkylator</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; background: #1e1e1e; color: #fff; }
        * { box-sizing: border-box; }
        h2, h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        
        .card { background: #2d2d2d; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; font-size: 16px; background: #3d3d3d; color: #fff; }
        input:focus, select:focus { outline: none; border-color: #0a84ff; }
        
        button { background: #0a84ff; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:active { background: #0066cc; }
        button.danger { background: #ff453a; }
        button.success { background: #32d74b; color: #000; }
        button.secondary { background: #555; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #444; border-radius: 8px; flex: 1; padding: 10px; text-align: center; font-weight: bold; }
        .tab-btn.active { background: #0a84ff; }
        
        .hidden { display: none; }
        
        /* Listor */
        .list-item { display: flex; flex-direction: column; background: #3d3d3d; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .list-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .list-title { font-weight: bold; font-size: 1.1rem; }
        .list-price { color: #32d74b; font-weight: bold; }
        
        .action-btns { display: flex; gap: 8px; width: 100%; }
        .action-btns button { padding: 6px 12px; margin: 0; font-size: 14px; flex: 1; }
        
        #budget-display { font-size: 1.5rem; text-align: center; font-weight: bold; color: #32d74b; margin-top: 5px; }
        #budget-display.negative { color: #ff453a; }
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
    </style>
</head>
<body>

    <div class="tabs">
        <div class="tab-btn active" id="tab-shop" onclick="switchTab('shop')">🛒 Handla</div>
        <div class="tab-btn" id="tab-db" onclick="switchTab('db')">📦 Databas</div>
    </div>

    <div class="card">
        <button id="start-scanner-btn" onclick="startScanner()">Slå på Kamera</button>
        <button id="stop-scanner-btn" class="hidden danger" onclick="stopScanner()">Stäng av Kamera</button>
        <div id="reader" class="hidden"></div>
    </div>

    <div id="view-shop">
        <div class="card">
            <h3>Budget (kr)</h3>
            <input type="number" id="budget-input" placeholder="T.ex. 1000" oninput="calculateTotal()">
            <div id="budget-display">0.00 kr kvar</div>
        </div>

        <div class="card" id="active-item-card">
            <h3 style="color: #0a84ff;">Aktiv Vara (Inskannad)</h3>
            <input type="text" id="shop-barcode" placeholder="Streckkod (Skanna eller skriv)" onchange="lookupItem()">
            <div id="shop-item-info" style="margin-bottom: 10px; font-weight: bold;"></div>
            
            <input type="number" id="shop-qty" placeholder="Antal (st) / Vikt (gram)">
            <button class="success" onclick="addToCart()">Lägg till i listan</button>
        </div>

        <div class="card">
            <h3>Köplista</h3>
            <div id="cart-list"></div>
            <button onclick="exportCSV()" style="margin-top: 15px;">📥 Exportera till CSV</button>
            <button class="danger" onclick="clearCart()">🗑 Rensa hela listan</button>
        </div>
    </div>

    <div id="view-db" class="hidden">
        <div class="card">
            <h3 id="db-form-title">Lägg till / Uppdatera Vara</h3>
            <input type="text" id="db-barcode" placeholder="Streckkod (Skanna eller skriv)">
            <input type="text" id="db-name" placeholder="Varans namn">
            <select id="db-type">
                <option value="st">Styckpris</option>
                <option value="kg">Kilopris</option>
            </select>
            <input type="number" id="db-price" placeholder="Pris per st/kg (kr)">
            <button class="success" id="db-save-btn" onclick="saveToDB()">Spara till Databas</button>
            <button class="secondary hidden" id="db-cancel-btn" onclick="clearDBForm()">Avbryt redigering</button>
        </div>
        
        <div class="card">
            <h3>Sparade Varor (JSON-databas)</h3>
            <div id="db-list"></div>
        </div>
    </div>

    <script>
        // Data states
        let database = JSON.parse(localStorage.getItem('groceryDB')) || {};
        let cart = JSON.parse(localStorage.getItem('groceryCart')) || [];
        let html5QrcodeScanner = null;
        let currentMode = 'shop';

        window.onload = () => {
            document.getElementById('budget-input').value = localStorage.getItem('groceryBudget') || "";
            renderCart();
            renderDB();
        };

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('view-shop').classList.toggle('hidden', mode !== 'shop');
            document.getElementById('view-db').classList.toggle('hidden', mode !== 'db');
            document.getElementById('tab-shop').classList.toggle('active', mode === 'shop');
            document.getElementById('tab-db').classList.toggle('active', mode === 'db');
        }

        // --- KAMERA / SKANNER ---
        function startScanner() {
            document.getElementById('reader').classList.remove('hidden');
            document.getElementById('start-scanner-btn').classList.add('hidden');
            document.getElementById('stop-scanner-btn').classList.remove('hidden');

            const html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => { html5QrcodeScanner = html5QrCode; })
            .catch(err => {
                alert("Kunde inte starta kameran. Kontrollera behörigheter (HTTPS krävs).");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner = null;
                    document.getElementById('reader').classList.add('hidden');
                    document.getElementById('start-scanner-btn').classList.remove('hidden');
                    document.getElementById('stop-scanner-btn').classList.add('hidden');
                });
            }
        }

        function onScanSuccess(decodedText) {
            if (currentMode === 'shop') {
                document.getElementById('shop-barcode').value = decodedText;
                lookupItem();
            } else {
                document.getElementById('db-barcode').value = decodedText;
            }
            if(navigator.vibrate) navigator.vibrate(100); 
        }

        // --- DATABAS FUNKTIONER (JSON i LocalStorage) ---
        function saveToDB() {
            const barcode = document.getElementById('db-barcode').value.trim();
            const name = document.getElementById('db-name').value.trim();
            const type = document.getElementById('db-type').value;
            const price = parseFloat(document.getElementById('db-price').value);

            if (!barcode || !name || isNaN(price)) {
                alert("Fyll i alla fält korrekt.");
                return;
            }

            database[barcode] = { name, type, price };
            localStorage.setItem('groceryDB', JSON.stringify(database));
            
            clearDBForm();
            renderDB();
            renderCart(); // Uppdaterar namnen/priserna i kundvagnen om de ändrats i db
            alert("Vara sparad!");
        }

        function editDBItem(barcode) {
            const item = database[barcode];
            if (!item) return;

            document.getElementById('db-barcode').value = barcode;
            document.getElementById('db-name').value = item.name;
            document.getElementById('db-type').value = item.type;
            document.getElementById('db-price').value = item.price;

            document.getElementById('db-form-title').innerText = "Redigera Vara";
            document.getElementById('db-save-btn').innerText = "Uppdatera Ändringar";
            document.getElementById('db-cancel-btn').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function removeDBItem(barcode) {
            if (confirm(`Vill du helt radera "${database[barcode].name}" från databasen?`)) {
                delete database[barcode];
                localStorage.setItem('groceryDB', JSON.stringify(database));
                renderDB();
            }
        }

        function clearDBForm() {
            document.getElementById('db-barcode').value = "";
            document.getElementById('db-name').value = "";
            document.getElementById('db-price').value = "";
            document.getElementById('db-form-title').innerText = "Lägg till / Uppdatera Vara";
            document.getElementById('db-save-btn').innerText = "Spara till Databas";
            document.getElementById('db-cancel-btn').classList.add('hidden');
        }

        function renderDB() {
            const container = document.getElementById('db-list');
            container.innerHTML = "";
            for (let code in database) {
                let item = database[code];
                container.innerHTML += `
                    <div class="list-item">
                        <div class="list-row">
                            <span class="list-title">${item.name}</span>
                            <span style="font-weight:bold;">${item.price} kr/${item.type}</span>
                        </div>
                        <div class="list-row">
                            <small style="color:#aaa;">Streckkod: ${code}</small>
                        </div>
                        <div class="action-btns" style="margin-top: 5px;">
                            <button onclick="editDBItem('${code}')">Ändra</button>
                            <button class="danger" onclick="removeDBItem('${code}')">Ta bort</button>
                        </div>
                    </div>`;
            }
        }

        // --- HANDLA / KASSA FUNKTIONER ---
        function lookupItem() {
            const barcode = document.getElementById('shop-barcode').value.trim();
            const infoDiv = document.getElementById('shop-item-info');
            const qtyInput = document.getElementById('shop-qty');
            
            if (database[barcode]) {
                const item = database[barcode];
                let unitStr = item.type === 'kg' ? 'kr/kg' : 'kr/st';
                infoDiv.innerHTML = `${item.name} - ${item.price} ${unitStr}`;
                infoDiv.style.color = "#32d74b";
                qtyInput.placeholder = item.type === 'kg' ? "Ange vikt i gram" : "Ange antal stycken";
                qtyInput.focus();
            } else {
                infoDiv.innerHTML = "⚠️ Okänd streckkod. Lägg till den i Databasen.";
                infoDiv.style.color = "#ff453a";
            }
        }

        function addToCart() {
            const barcode = document.getElementById('shop-barcode').value.trim();
            const inputVal = parseFloat(document.getElementById('shop-qty').value);
            
            if (!database[barcode]) {
                alert("Varan finns inte i databasen.");
                return;
            }
            if (isNaN(inputVal) || inputVal <= 0) {
                alert("Ange ett giltigt antal eller vikt.");
                return;
            }

            const item = database[barcode];
            let totalPrice = 0;
            let displayQty = "";

            if (item.type === 'kg') {
                totalPrice = (item.price * inputVal) / 1000;
                displayQty = `${inputVal} gram`;
            } else {
                totalPrice = item.price * inputVal;
                displayQty = `${inputVal} st`;
            }

            cart.push({
                barcode: barcode,
                inputVal: inputVal,
                displayQty: displayQty,
                totalPrice: totalPrice
            });

            localStorage.setItem('groceryCart', JSON.stringify(cart));
            
            document.getElementById('shop-barcode').value = "";
            document.getElementById('shop-qty').value = "";
            document.getElementById('shop-item-info').innerHTML = "";
            
            renderCart();
        }

        function editCartItem(index) {
            const itemInCart = cart[index];
            const itemInDB = database[itemInCart.barcode];
            
            if (!itemInDB) {
                alert("Denna varas ursprungliga inställningar hittades inte i databasen.");
                return;
            }

            let promptMsg = itemInDB.type === 'kg' ? `Ange ny vikt i gram för ${itemInDB.name}:` : `Ange nytt antal stycken för ${itemInDB.name}:`;
            let newVal = prompt(promptMsg, itemInCart.inputVal);
            
            if (newVal === null) return; // Användaren tryckte på avbryt
            newVal = parseFloat(newVal);

            if (isNaN(newVal) || newVal <= 0) {
                alert("Ogiltigt värde inskrivet.");
                return;
            }

            itemInCart.inputVal = newVal;
            if (itemInDB.type === 'kg') {
                itemInCart.totalPrice = (itemInDB.price * newVal) / 1000;
                itemInCart.displayQty = `${newVal} gram`;
            } else {
                itemInCart.totalPrice = itemInDB.price * newVal;
                itemInCart.displayQty = `${newVal} st`;
            }

            localStorage.setItem('groceryCart', JSON.stringify(cart));
            renderCart();
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('groceryCart', JSON.stringify(cart));
            renderCart();
        }

        function clearCart() {
            if(confirm("Är du säker på att du vill rensa hela köplistan?")) {
                cart = [];
                localStorage.setItem('groceryCart', JSON.stringify(cart));
                renderCart();
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-list');
            container.innerHTML = "";
            
            cart.forEach((item, index) => {
                // Hämta färsk data från DB ifall namn eller baspris har ändrats i efterhand
                const dbRef = database[item.barcode] || { name: "Borttagen produkt", price: 0, type: "st" };
                
                // Om baspriset i DB ändrats räknar vi om det sparade priset i kassan automatiskt
                let calculatedPrice = item.totalPrice;
                if (database[item.barcode]) {
                    calculatedPrice = dbRef.type === 'kg' ? (dbRef.price * item.inputVal) / 1000 : dbRef.price * item.inputVal;
                }

                container.innerHTML += `
                    <div class="list-item">
                        <div class="list-row">
                            <span class="list-title">${dbRef.name}</span>
                            <span class="list-price">${calculatedPrice.toFixed(2)} kr</span>
                        </div>
                        <div class="list-row">
                            <small style="color:#aaa;">${item.displayQty} (à ${dbRef.price} kr/${dbRef.type})</small>
                        </div>
                        <div class="action-btns" style="margin-top: 5px;">
                            <button onclick="editCartItem(${index})">Ändra mängd</button>
                            <button class="danger" onclick="removeCartItem(${index})">Ta bort</button>
                        </div>
                    </div>
                `;
            });
            calculateTotal();
        }

        function calculateTotal() {
            const budgetInput = document.getElementById('budget-input').value;
            localStorage.setItem('groceryBudget', budgetInput);
            
            let budget = parseFloat(budgetInput) || 0;
            
            // Räkna ut summan dynamiskt baserat på gällande databasvärden
            let sum = cart.reduce((acc, item) => {
                const dbRef = database[item.barcode];
                if (!dbRef) return acc + item.totalPrice;
                let price = dbRef.type === 'kg' ? (dbRef.price * item.inputVal) / 1000 : dbRef.price * item.inputVal;
                return acc + price;
            }, 0);

            let remaining = budget - sum;

            const display = document.getElementById('budget-display');
            display.innerText = `${remaining.toFixed(2)} kr kvar`;
            
            if (remaining < 0) {
                display.classList.add('negative');
            } else {
                display.classList.remove('negative');
            }
        }

        // --- EXPORT FUNKTION ---
        function exportCSV() {
            if (cart.length === 0) {
                alert("Listan är tom.");
                return;
            }

            let csvContent = "\uFEFFNamn,Typ,Pris_per_enhet,Inmatning,Summa_kr\n";
            
            cart.forEach(item => {
                const dbRef = database[item.barcode] || { name: "Okänd", price: 0, type: "st" };
                let currentPrice = dbRef.type === 'kg' ? (dbRef.price * item.inputVal) / 1000 : dbRef.price * item.inputVal;
                
                let row = `${dbRef.name},${dbRef.type},${dbRef.price},${item.displayQty},${currentPrice.toFixed(2)}`;
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            
            const dateStr = new Date().toISOString().replace(/[:.]/g, '-');
            link.setAttribute("download", `Inkop_${dateStr}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
