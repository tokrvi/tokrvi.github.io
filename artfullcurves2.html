<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmisk Kurvritare - Radiokontroller</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* UI-panel med mjuk övergång */
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            transition: all 0.3s ease-in-out;
            max-width: 280px;
        }
        #ui.collapsed {
            padding: 5px;
            background: rgba(0, 0, 0, 0.6);
        }
        #uiContent {
            transition: opacity 0.2s ease;
        }
        .hidden {
            display: none !important;
        }
        
        /* Knapp- och radiostilar */
        .radio-group {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
        }
        .radio-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .radio-group label:last-child {
            margin-bottom: 0;
        }
        
        .main-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            flex-grow: 1;
        }
        button:hover { background: #444; }
        
        #clearBtn {
            width: 100%;
            background: #552222;
            border-color: #773333;
        }
        #clearBtn:hover { background: #663333; }
        
        #toggleUiBtn {
            background: #222;
            border-color: #444;
            width: 100%;
            margin-bottom: 10px;
        }
        #toggleUiBtn:hover { background: #333; }
        #ui.collapsed #toggleUiBtn {
            margin-bottom: 0;
            width: auto;
        }

        /* Status text */
        .status-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 4px;
            margin-top: 15px;
            border: 1px solid #222;
        }
        .status-text { 
            margin-bottom: 4px; 
            font-size: 13px;
            color: #ccc;
        }
        .status-text:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div id="ui">
        <button id="toggleUiBtn">Dölj panel</button>
        
        <div id="uiContent">
            
            <div class="radio-group">
                <label><input type="radio" name="controlMode" value="curves" checked> Antal kurvor (1-5)</label>
                <label><input type="radio" name="controlMode" value="angle"> Vinkelintervall (10°-90°)</label>
                <label><input type="radio" name="controlMode" value="size"> Linjebredd (1-10)</label>
                <label><input type="radio" name="controlMode" value="speed"> Rithastighet (1-10)</label>
            </div>

            <div class="main-controls">
                <button id="decBtn">➖ Minska</button>
                <button id="incBtn">➕ Öka</button>
            </div>

            <button id="clearBtn">Rensa skärm</button>

            <div class="status-box">
                <div id="statusCurves" class="status-text">Aktiva kurvor: 1</div>
                <div id="statusAngle" class="status-text">Intervall: ±45°</div>
                <div id="statusSize" class="status-text">Linjebredd: 2</div>
                <div id="statusSpeed" class="status-text">Hastighet: 1</div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff8800'];
        
        // Parametrar
        const angleIntervals = [10, 15, 30, 45, 60, 75, 90];
        let angleIndex = 3; // 45 grader
        let penSize = 2;    // Linjebredd 1-10
        let drawSpeed = 1;  // Rithastighet 1-10

        class Curve {
            constructor(color) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.angle = Math.random() * Math.PI * 2;
                this.color = color;
                this.register = [];
                this.stepSize = 10;
            }

            updateAndDraw() {
                const bit = Math.random() < 0.5 ? 0 : 1;
                this.register.push(bit);

                let angleChange = 0;
                const currentInterval = angleIntervals[angleIndex];

                if (this.register.length >= 2) {
                    const len = this.register.length;
                    const last = this.register[len - 1];
                    const prev = this.register[len - 2];

                    if (last === 0 && prev === 0) {
                        angleChange = -currentInterval;
                        this.register = []; 
                    } 
                    else if (last === 1 && prev === 1) {
                        angleChange = currentInterval;
                        this.register = [];
                    } 
                    else {
                        angleChange = 0;
                        if (this.register.length > 5) {
                            this.register.shift();
                        }
                    }
                }

                this.angle += angleChange * (Math.PI / 180);

                const nextX = this.x + Math.cos(this.angle) * this.stepSize;
                const nextY = this.y + Math.sin(this.angle) * this.stepSize;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(nextX, nextY);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = penSize;
                ctx.stroke();

                this.x = nextX;
                this.y = nextY;

                if (this.x < 0) this.x += canvas.width;
                if (this.x > canvas.width) this.x -= canvas.width;
                if (this.y < 0) this.y += canvas.height;
                if (this.y > canvas.height) this.y -= canvas.height;
            }
        }

        let curves = [];
        curves.push(new Curve(colors[0]));

        // Uppdaterar texten i statusrutan
        function updateUI() {
            document.getElementById('statusCurves').innerText = `Aktiva kurvor: ${curves.length}`;
            document.getElementById('statusAngle').innerText = `Intervall: ±${angleIntervals[angleIndex]}°`;
            document.getElementById('statusSize').innerText = `Linjebredd: ${penSize}`;
            document.getElementById('statusSpeed').innerText = `Hastighet: ${drawSpeed}`;
        }

        // Huvudfunktion för att öka det valda värdet
        document.getElementById('incBtn').addEventListener('click', () => {
            const mode = document.querySelector('input[name="controlMode"]:checked').value;
            
            if (mode === 'curves' && curves.length < 5) {
                curves.push(new Curve(colors[curves.length]));
            } 
            else if (mode === 'angle' && angleIndex < angleIntervals.length - 1) {
                angleIndex++;
            } 
            else if (mode === 'size' && penSize < 10) {
                penSize++;
            }
            else if (mode === 'speed' && drawSpeed < 10) {
                drawSpeed++;
            }
            updateUI();
        });

        // Huvudfunktion för att minska det valda värdet
        document.getElementById('decBtn').addEventListener('click', () => {
            const mode = document.querySelector('input[name="controlMode"]:checked').value;
            
            if (mode === 'curves' && curves.length > 1) {
                curves.pop();
            } 
            else if (mode === 'angle' && angleIndex > 0) {
                angleIndex--;
            } 
            else if (mode === 'size' && penSize > 1) {
                penSize--;
            }
            else if (mode === 'speed' && drawSpeed > 1) {
                drawSpeed--;
            }
            updateUI();
        });

        // Rensa skärmen
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            curves.forEach(c => {
                c.x = Math.random() * canvas.width;
                c.y = Math.random() * canvas.height;
                c.register = [];
            });
        });

        // Dölj/Visa panel
        const toggleUiBtn = document.getElementById('toggleUiBtn');
        const uiPanel = document.getElementById('ui');
        const uiContent = document.getElementById('uiContent');

        toggleUiBtn.addEventListener('click', () => {
            uiPanel.classList.toggle('collapsed');
            uiContent.classList.toggle('hidden');
            
            if (uiPanel.classList.contains('collapsed')) {
                toggleUiBtn.innerText = "Visa panel";
            } else {
                toggleUiBtn.innerText = "Dölj panel";
            }
        });

        // Animationsloop
        function animate() {
            // Ritar 'drawSpeed' antal steg per frame. 
            // Om drawSpeed = 1 ritas 1 steg per frame. Om drawSpeed = 10 ritas 10 steg (mycket snabbare).
            for (let i = 0; i < drawSpeed; i++) {
                curves.forEach(curve => curve.updateAndDraw());
            }
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
